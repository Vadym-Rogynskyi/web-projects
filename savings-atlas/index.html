<style>
  :root {

      --muted: #7E8473;
      --line: #292D21;
      --line-2: #3A3F30;
      --accent: #57A981;
      --accent-ink: #8FCBAC;
      --accent-soft: #17281F;
      --gold: #CBA24E;
      --gold-soft: #2C2513;
      --pos: #54B981; --pos-soft: #16301F;

  }

    --ink: #EBEEE1; --ink-2: #A7AD9B; --muted: #7E8473;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.55; -webkit-font-smoothing: antialiased; }

  .track { position: relative; height: 12px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }

  .badge svg { width: 11px; height: 11px; }

  .subform { margin-top: 13px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
  .subform .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quickchips { display: flex; gap: 6px; margin: 9px 0; flex-wrap: wrap; }

  .hist .h-row .num { color: var(--pos); font-weight: 600; }

  /* ---------- split bar ---------- */
  .splitbar { display: flex; gap: 2px; height: 30px; border-radius: 9px; overflow: hidden; background: var(--line); }
  .splitbar > div { min-width: 3px; display: flex; align-items: center; justify-content: center; }
  .splitbar > div span { font-size: 10.5px; font-weight: 700; color: #fff; padding: 0 6px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.25); }

  /* ---------- calculator ---------- */
  .calc-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }

  .calc-out .lead { font-size: 12px; font-weight: 600; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .03em; }

  .section-label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h2.guide-h { font-size: clamp(20px, 3vw, 25px); margin: 34px 0 4px; }
  h2.guide-h:first-of-type { margin-top: 6px; }
  .guide-sub { color: var(--ink-2); font-size: 13.5px; margin: 0 0 16px; max-width: 60ch; }

  .ladder { display: flex; flex-direction: column; gap: 0; counter-reset: rung; border-left: 2px solid var(--line-2); }
  .rung { position: relative; padding: 14px 0 14px 22px; border-bottom: 1px solid var(--line); }
  .rung:last-child { border-bottom: 0; }
  .rung::before { counter-increment: rung; content: counter(rung); position: absolute; left: -13px; top: 14px; width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font); font-size: 12px; font-weight: 700; }
  :root[data-theme="dark"] .rung::before { color: #0c150f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rung::before { color: #0c150f; } }
  .rung h4 { margin: 0; font-size: 16px; }
  .rung .r-amt { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); font-weight: 500; margin-top: 2px; }

  .rung .mycall { margin-top: 7px; font-size: 13px; padding: 8px 11px; background: var(--panel-2); border-radius: 9px; border-left: 3px solid var(--gold); }

  @media (min-width: 900px) { .cards.c3 { grid-template-columns: 1fr 1fr 1fr; } }
  .mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
  .mini h4 { margin: 0 0 5px; font-size: 14.5px; }

  .accordion summary::-webkit-details-marker { display: none; }

  .accordion .ac-body { padding: 0 15px 15px; }

  .accordion .ac-body li { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; margin: 7px 0; }
  .accordion .ac-body li b { color: var(--ink); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 5px; background: var(--gold-soft); color: var(--gold); margin-left: 4px; }

  .pullquote { font-family: var(--serif); font-style: italic; font-size: clamp(18px, 3vw, 23px); line-height: 1.4; color: var(--ink); border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin: 22px 0; max-width: 40ch; }

  .disclaimer { margin-top: 30px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 66ch; }

  .empty { text-align: center; padding: 40px 16px; }

  .empty p { margin: 0 0 16px; color: var(--ink-2); font-size: 13.5px; }

  #tip { position: fixed; z-index: 60; pointer-events: none; opacity: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 11px; font-size: 12px; min-width: 120px; transition: opacity .12s; }
  #tip .h { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; gap: 8px; padding: 1px 0; }
  #tip .r .lb { color: var(--ink-2); flex: 1; }
  #tip .r .vv { font-weight: 600; font-variant-numeric: tabular-nums; }

  .modal-bg { position: fixed; inset: 0; background: rgba(12,16,10,.5); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; width: 100%; max-width: 440px; }
  .modal h3 { margin: 0 0 14px; font-size: 19px; }

  .swatches button[aria-pressed="true"] { border-color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>

<script>
(function () {
  "use strict";

  var GOAL_HUES = ["--g0", "--g1", "--g2", "--g3", "--g4", "--g5", "--g6", "--g7"];

  /* ---------- dom ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };

  /* ---------- money / date ---------- */

  }

  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseISO(s) { var p = (s || "").split("-"); return new Date(+p[0], +p[1] - 1, +p[2] || 1); }
  function addMonths(date, n) { var d = new Date(date.getTime()); var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return d; }

    var need = target - saved;

  /* ---------- state ---------- */

  function totals() {

  /* ---------- tooltip ---------- */

  /* ---------- big projection area chart ---------- */

    (opts.annotations || []).forEach(function (a) {

  function niceMax(v) {

    var xl = []; for (var k = 0; k <= horizon; k++) { var d = addMonths(new Date(), k); xl.push(k % Math.max(1, Math.ceil(horizon / 6)) === 0 ? MO[d.getMonth()] + " ’" + String(d.getFullYear()).slice(2) : ""); }
    var mkIdx = calc.mode === "monthly" ? -1 : -1;
    areaLine(chost, {
      x: xl, aria: "Projected balance to goal",
      series: [{ label: "Balance", color: "var(--accent)", points: pts, area: true, emphasize: true }],
      annotations: [{ y: calc.target, label: "Goal " + money0(calc.target) }],
      tickEvery: Math.max(1, Math.ceil(horizon / 6))
    });
    host.appendChild(el("p", { style: "font-size:12px;color:var(--muted);margin:8px 0 0" }, [i > 0 ? "Curve assumes " + Math.round(i * 100) + "% annual return, compounded monthly. For goals under ~5 years, plan with the 0% cash number and treat any growth as a bonus." : "Straight-line at 0% — the safe way to plan a short-term goal."]));
  }
  function kv(k, v) { return el("div", { class: "kv" }, [el("div", { class: "k", text: k }), el("div", { class: "v", text: v })]); }

  /* ================= VIEW: GUIDE ================= */
  function renderGuide(root) {
    root.appendChild(el("div", { class: "panel", html: GUIDE_HTML }));
    var chost = $("#compoundChart", root);
    if (chost) {
      var months = 360;
      var contribOnly = projectSeries(0, 300, 0, months);
      var withGrowth = projectSeries(0, 300, 0.07, months);
      var xl = []; for (var k = 0; k <= months; k++) xl.push(k % 60 === 0 ? (k / 12) + "y" : "");
      areaLine(chost, {
        x: xl, h: 240, aria: "Contributions versus contributions plus growth over 30 years",
        series: [
          { label: "Money you put in", color: "var(--g7)", points: contribOnly, width: 2 },
          { label: "With 7% annual growth", color: "var(--accent)", points: withGrowth, width: 2, area: true, emphasize: true }
        ],
        tickEvery: 60
      });
      chost.appendChild(el("div", { class: "legend" }, [
        lg("var(--g7)", "Money you put in — " + money0(300 * months)),
        lg("var(--accent)", "With 7% growth — " + money0(withGrowth[months]))
      ]));
    }
    root.querySelectorAll("[data-tpl]").forEach(function (b) {
      b.addEventListener("click", function () { var t = TEMPLATES[+b.dataset.tpl]; if (t) openGoalModal(t); });
    });
  }
  function lg(c, t) { return el("span", { class: "lg" }, [el("span", { class: "sw", style: "background:" + c }), t]); }

  var GUIDE_HTML = [
    '<p class="section-label">A field guide</p>',
    '<h1 style="font-size:clamp(24px,4vw,32px);margin:0 0 10px">How to actually save money</h1>',
    '<div class="prose"><p class="lede">Saving isn\'t a personality trait or a math problem. It\'s a small set of decisions you make once and then automate, so that willpower never has to show up. Here is the whole system, in the order I\'d build it, with the reasoning and the trade-offs laid bare.</p></div>',

    '<div class="pullquote">Every dollar gets a name and a job. “Savings” evaporates; “$4,800 for Japan in April” survives.</div>',

    '<h2 class="guide-h">The seven principles</h2>',
    '<p class="guide-sub">If you only take a handful of things from this page, take these.</p>',
    '<div class="cards c3">',
    card("Pay yourself first", "Automate a transfer for the day you\'re paid, before the money can be spent. Treat savings like rent — a bill that comes out no matter what."),
    card("Name every dollar", "A goal with a name, a number, and a date gets funded. A vague “I should save more” does not. Specificity is the trick."),
    card("Separate the accounts", "Friction protects intent. Keep goal money in a separate high-yield savings account — ideally split into named buckets — not mixed into checking."),
    card("Earn yield on idle cash", "A high-yield savings account (HYSA) pays far more than checking for the same zero risk. For larger balances, money-market funds and T-bills."),
    card("Match money to time", "Under 1 year: cash / HYSA. 1–3 years: HYSA, CDs, short bonds. 5+ years and retirement: invest in broad index funds. Never put next year\'s rent in the stock market."),
    card("Escalate automatically", "Raise your savings rate 1% every few months, and bank half of every raise before lifestyle absorbs it. You won\'t feel it; the curve will."),
    '</div>',

    '<h2 class="guide-h">The order I\'d fund things</h2>',
    '<p class="guide-sub">This is my opinionated sequence. Money is limited, so priority is everything — each rung earns a higher guaranteed return than the one below it. Do them roughly in order; a little overlap is fine.</p>',
    '<div class="ladder">',
    rung("Know your numbers", "no cost, one evening", "Track a month of spending. You need two figures: your essential monthly expenses, and how much is genuinely free to save. Everything below depends on these.", "I don\'t budget every category forever — I just need the two numbers, then I automate against them and check in quarterly."),
    rung("Starter emergency fund", "$1,000–$2,000, or one month of essentials", "A small cash cushion in a HYSA so that a flat tyre or a vet bill doesn\'t become credit-card debt. This comes before aggressive debt payoff because without it, the next surprise undoes your progress.", "I keep this as a permanent floor and never let the balance drop below it."),
    rung("Capture the employer match", "whatever unlocks the full match", "If your job matches retirement contributions, that\'s an instant 50–100% return — the best deal you will ever get. Contribute at least enough to get all of it, even while building the fund.", "This is the one place I\'d interrupt every other priority. Free money with a guaranteed return beats everything."),
    rung("Kill high-interest debt", "everything above ~7–8% APR", "Credit cards, payday loans, anything with a rate that outruns what investing can reliably earn. Paying off a 22% card is a guaranteed, tax-free 22% return. Use the avalanche method (highest rate first) for the math, or snowball (smallest balance first) if you need the momentum.", "I\'d throw every spare dollar here and pause taxable investing until it\'s gone. Below ~6% (a mortgage, a subsidised student loan) I\'d pay the minimum and invest instead."),
    rung("Full emergency fund", "3–6 months of essential expenses", "The real safety net. Three months if you have stable, dual income and an in-demand skill; six or more if you\'re a single earner, self-employed, on commission, or have dependents. Keep it boring: HYSA or money market, instantly accessible.", "I sit at the higher end — six months — because it buys the freedom to walk away from a bad job, which is worth more than the small yield I give up."),
    rung("Fund your near-term goals", "the vacation, the car, the ring, the move", "Now the fun part. Sinking funds for everything you know is coming in the next few years: divide the total by the months you have, save that amount monthly, and the “surprise” expense never surprises you again.", "I run 4–6 of these at once, each automated on payday. The Goals tab of this app is built for exactly this rung."),
    rung("Build long-term wealth", "toward 15%+ of gross income, then more", "Raise retirement contributions toward 15% of gross, then invest beyond that in a taxable brokerage account in low-cost, broad-market index funds. Time in the market is the lever — start now with whatever you have.", "Once the rungs above are solid, this is where I\'d direct every raise and windfall. Automate the buys so you\'re never timing the market."),
    '</div>',

    '<h2 class="guide-h">Match the money to the horizon</h2>',
    '<p class="guide-sub">The single most common mistake is holding long-term money in cash, or short-term money in stocks. Use this.</p>',
    '<div class="tablewrap"><table class="dv"><thead><tr><th>When you need it</th><th>Where it belongs</th><th>Why</th></tr></thead><tbody>',
    trow("Now – 12 months", "High-yield savings, money market", "Capital must be there in full on the day you need it. No volatility."),
    trow("1 – 3 years", "HYSA, CDs, short-term Treasuries / bond funds", "A little more yield, still very low risk of loss over the window."),
    trow("3 – 5 years", "Conservative mix — mostly bonds, a slice of stocks", "Some growth, but you can\'t fully ride out a downturn, so stay cautious."),
    trow("5 – 10 years", "Balanced index funds (e.g. 60/40)", "Long enough to recover from a bad year, short enough to temper risk."),
    trow("10+ years / retirement", "Broad stock index funds", "Volatility is noise at this range; growth and compounding dominate."),
    '</tbody></table></div>',

    '<h2 class="guide-h">Three frameworks worth knowing</h2>',
    '<div class="cards">',
    '<div class="mini"><h4>50 / 30 / 20</h4><p>Of your take-home pay: ~50% to needs, ~30% to wants, ~20% to saving and extra debt paydown. A starting sanity check, not a law — push the savings share up whenever you can. There\'s a live splitter on the Calculator tab.</p></div>',
    '<div class="mini"><h4>Savings rate is the number</h4><p>Savings ÷ take-home pay. Under 10% is a start; 20% is solid; 30%+ is strong; 50%+ puts early financial independence on the table. Your <em>rate</em>, not your income, sets the date — see the slider on the Calculator tab.</p></div>',
    '<div class="mini"><h4>Sinking funds</h4><p>For known irregular costs — car service, insurance premiums, gifts, property tax, travel. Add up the annual total, divide by 12, save that every month. The bill still arrives; the stress doesn\'t.</p></div>',
    '</div>',

    '<h2 class="guide-h">Why starting now beats starting bigger</h2>',
    '<div class="prose"><p>Compounding rewards <em>time</em> far more than it rewards the rate or the amount. Below: $300 a month for 30 years. The money you contribute is a straight line. The growth is where the curve bends — and almost all of that bend happens in the final decade, which only exists if you start today.</p></div>',
    '<div class="chart-host" id="compoundChart"></div>',
    '<div class="prose" style="margin-top:14px"><p>The flip side: for goals inside five years, <em>don\'t</em> count on that curve. Plan with the plain cash math, keep the money safe, and let any interest be a happy accident.</p></div>',

    '<h2 class="guide-h">Ideas to find the money</h2>',
    '<p class="guide-sub">Grouped by type. The tag is a rough sense of annual impact — your mileage will vary.</p>',
    '<div class="accordion">',
    acc("Plug the quiet leaks", [
      "<b>Audit subscriptions every 6 months.</b> Cancel anything you didn\'t deliberately use this month; you can always re-add it. Most people underestimate this spend by 2–3×. <span class=\"tag\">$150–$600/yr</span>",
      "<b>Negotiate recurring bills once a year.</b> Internet, phone, insurance — 20 minutes on the phone, ask for the retention offer or threaten to leave. <span class=\"tag\">$100–$500/yr</span>",
      "<b>Raise insurance deductibles</b> once your emergency fund can absorb them. Higher deductible, lower premium. <span class=\"tag\">$100–$400/yr</span>",
      "<b>Meal-plan the week before shopping.</b> Groceries beat delivery roughly 3–4×; the waste from no plan is the hidden cost. <span class=\"tag\">$1,000–$3,000/yr</span>"
    ]),
    acc("Bank the windfalls", [
      "<b>Pre-commit your raises.</b> The month a raise lands, increase your automatic transfer by half of it. You never adjust to money you didn\'t see.",
      "<b>Save 50–90% of every windfall</b> — tax refund, bonus, gift, cash-back, rebate — <em>before</em> it touches checking.",
      "<b>The payday sweep.</b> The day before you\'re paid, move whatever\'s left in checking to savings. Unspent becomes saved instead of drifting."
    ]),
    acc("Beat your own impulses", [
      "<b>The 72-hour rule.</b> For any non-essential purchase over a threshold you set (say $75), wait three days. Most wants evaporate; the real ones don\'t.",
      "<b>Keep a 30-day list.</b> Write the want down with the date. At month-end, buy only what still matters. Cheap, and revealing.",
      "<b>One in, one out.</b> New jacket means an old one leaves. Caps accumulation without a spreadsheet.",
      "<b>Cap lifestyle creep on purpose.</b> Fix your ‘fun money’ at a set percentage of income so it grows slowly, not in step with every raise.",
      "<b>Run a no-spend week</b> once a quarter as a reset — no discretionary spending, pantry meals, free plans. It recalibrates what you actually miss."
    ]),
    acc("Automate and protect", [
      "<b>Split your direct deposit</b> so money lands in savings without a transfer step. What you don\'t see, you don\'t spend.",
      "<b>Use round-up transfers</b> if your bank offers them — painless, small, and they compound.",
      "<b>Increase your retirement contribution 1% today.</b> On most salaries the take-home difference is a few dollars a week and invisible within a month.",
      "<b>Keep at least two accounts</b> — a bills checking and a savings — and ideally a third ‘spending’ buffer so a big month doesn\'t raid the goals."
    ]),
    '</div>',

    '<h2 class="guide-h">A few things I\'ve decided about all this</h2>',
    '<div class="tablewrap"><table class="dv"><thead><tr><th>Situation</th><th>What I\'d do</th><th>Why</th></tr></thead><tbody>',
    trow("Debt at 20%+ and no savings", "Build a $1k cushion, grab any match, then attack the debt", "The cushion stops new debt; the match is free; the debt payoff is a guaranteed 20% return."),
    trow("Stable job, 3 months saved, a trip in mind", "Keep the fund at 3–6 months, open a sinking fund for the trip", "The safety net is adequate; now money can go to living, not just defending."),
    trow("Big raise just landed", "Raise automatic savings by half of it, same day", "Lifestyle expands to fill income. Intercept it before it does."),
    trow("Goal money for something 2 years out", "HYSA, not investments", "A 20% market drop the month before you buy is not a risk worth a couple of extra percent."),

    '</tbody></table></div>',

    '<h2 class="guide-h">Templates to start from</h2>',
    '<p class="guide-sub">One tap creates the goal with a sensible target — then set your own date and monthly amount.</p>',
    '<div class="chips">',
    TEMPLATES.map(function (t, i) { return '<button class="chip" data-tpl="' + i + '">+ ' + t.name + ' · ' + t.note + '</button>'; }).join(""),
    '</div>',

    '<p class="disclaimer">This is general educational information and reflects one set of opinions — not personalised financial, tax, or investment advice. Rates, returns, and the right moves depend on your situation and where you live. For big decisions, talk to a fee-only fiduciary adviser.</p>'

  function card(h, p) { return '<div class="mini"><h4>' + h + '</h4><p>' + p + '</p></div>'; }
  function rung(h, amt, p, mycall) { return '<div class="rung"><h4>' + h + '</h4><div class="r-amt">' + amt + '</div><p>' + p + '</p><div class="mycall"><b>My call:</b> ' + mycall + '</div></div>'; }
  function trow(a, b, c) { return '<tr><td>' + a + '</td><td>' + b + '</td><td style="color:var(--ink-2)">' + c + '</td></tr>'; }
  function acc(title, items) {
    return '<details><summary>' + title + '<span class="plus">+</span></summary><div class="ac-body"><ul>' + items.map(function (i) { return '<li>' + i + '</li>'; }).join("") + '</ul></div></details>';
  }

  /* ================= settings ================= */
  function openMenu() {
    var symI = el("input", { value: S.settings.symbol, maxlength: "3", style: "width:70px" });
    var modal = el("div", { class: "modal" }, [
      el("h3", { text: "Data & settings" }),
      el("label", { class: "f", style: "flex-direction:row;align-items:center;gap:10px" }, ["Currency symbol", symI]),
      el("p", { style: "font-size:12.5px;color:var(--ink-2);margin:14px 0 0" }, ["Everything is stored only in this browser. Nothing is sent anywhere."]),
      el("div", { class: "row" }, [
        el("button", { class: "btn ghost", onclick: function () { try { navigator.clipboard.writeText(JSON.stringify(S, null, 2)); b.textContent = "Copied ✓"; } catch (e) {} }, id: "cpy" }, ["Copy my data (JSON)"]),
      ]),
      el("div", { class: "row" }, [
        el("button", { class: "btn danger", onclick: function () { if (confirm("Replace everything with the sample goals?")) { S = seed(); save(); bg.remove(); render(); } } }, ["Reset to sample"]),
        el("button", { class: "btn danger", onclick: function () { if (confirm("Delete all goals and start empty?")) { S = { goals: [], settings: S.settings }; save(); bg.remove(); render(); } } }, ["Clear all"])
      ]),
      el("div", { class: "row" }, [el("button", { class: "btn", style: "flex:1", onclick: function () { S.settings.symbol = symI.value.trim() || "$"; save(); bg.remove(); render(); } }, ["Done"])])
    ]);
    var b = modal.querySelector("#cpy");
    var bg = el("div", { class: "modal-bg", onclick: function (e) { if (e.target === bg) { S.settings.symbol = symI.value.trim() || "$"; save(); bg.remove(); render(); } } }, [modal]);
    document.body.appendChild(bg);
  }

  /* ================= theme ================= */
  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    $("#themeIcon").innerHTML = dark ? SUN : MOON;
  }
  var savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme);
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var now = cur || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = now === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next); render();
  });
  $("#menuBtn").addEventListener("click", openMenu);

  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
    b.addEventListener("click", function () { view = b.dataset.view; scrollTo({ top: 0, behavior: "instant" in document.documentElement.style ? "instant" : "auto" }); render(); });
  });
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 160); });

  /* ================= render ================= */
  function renderSummary() {
    var t = totals();
    var pct = t.target > 0 ? Math.round(t.saved / t.target * 100) : 0;
    var host = $("#summary"); host.innerHTML = "";
    host.appendChild(cell("Saved across all goals", money0(t.saved), pct + "% of " + money0(t.target), true));
    host.appendChild(cell("Goals in progress", String(S.goals.filter(function (g) { return g.saved < g.target; }).length), S.goals.length + " total"));
    host.appendChild(cell("Going in each month", money0(t.monthly), S.settings.takeHome ? Math.round(t.monthly / S.settings.takeHome * 100) + "% of take-home" : "across active goals"));
    var latestTxt = t.latest === "unknown" || !t.latest ? "set monthly amounts" : "on this pace";
    var latestVal = (t.latest && t.latest !== "unknown") ? fmtMonthYear(t.latest) : "—";
    host.appendChild(cell("Everything funded by", latestVal, latestTxt));
  }
  function cell(k, v, s, hero) { return el("div", { class: "sm-cell" + (hero ? " hero" : "") }, [el("div", { class: "k", text: k }), el("div", { class: "v", text: v }), el("div", { class: "s", text: s })]); }

  function render() {
    renderSummary();
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.setAttribute("aria-selected", String(b.dataset.view === view)); });
    var host = $("#view"); host.innerHTML = "";
    var root = el("div"); host.appendChild(root);
    if (view === "goals") renderGoals(root);
    else if (view === "calculator") renderCalculator(root);
    else renderGuide(root);
  }

  render();
})();
</script>
