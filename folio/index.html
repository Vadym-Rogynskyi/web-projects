const editionCache=new Map();
async function fetchBookData(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6000);try{const r=await fetch(url,{signal:ctrl.signal});if(!r.ok)throw Error();return await r.json()}finally{clearTimeout(timer)}}
async function loadEditions(i,box){const [title,author]=data[i];box.textContent='Looking up editions…';try{if(!editionCache.has(i)){const params=new URLSearchParams({title,author:author.split(' and ')[0],fields:'key,title',limit:'5'});const hit=await fetchBookData('https://openlibrary.org/search.json?'+params);const norm=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');const work=hit.docs?.find(d=>norm(d.title)===norm(title)&&/^\/works\/OL\d+W$/.test(d.key));if(!work)throw Error();const records=await fetchBookData('https://openlibrary.org'+work.key+'/editions.json?limit=12');const entries=records.entries.filter(e=>/^\/books\/OL\d+M$/.test(e.key));if(!entries.length)throw Error();editionCache.set(i,entries)}box.replaceChildren();for(const e of editionCache.get(i)){const link=document.createElement('a');link.href='https://openlibrary.org'+e.key;link.target='_blank';link.rel='noopener';link.textContent=[e.publish_date,e.publishers?.[0],e.physical_format].filter(Boolean).join(' · ')||e.title||'View edition';box.append(link)}}catch{box.textContent='Edition details are unavailable here. Use “Find editions on Open Library” above to continue.'}}
const prompts={'Finance':'Which assumption about money would you like to test?','Languages':'What example could you try in your next conversation?','Fiction':'What does the narrator invite you to overlook?','Science':'Which observation would change the explanation?','Business':'Where could you test one idea at a small scale?','Memoir':'Which memory changes meaning as the story unfolds?','Fantasy':'What does power cost in this world?','Science fiction':'Which imagined rule changes everyday life most?','Mystery':'Which detail supports two competing explanations?','History':'Whose perspective changes the way you see this event?','Sports':'What happens in practice that no spectator sees?','Food':'Which ingredient or technique would you try first?','Art & design':'Which visual choice changes what you notice first?','Technology':'Who defines success for the technology described here?','Poetry':'Which image stays with you when you reread the poem?','Philosophy':'What counterexample would test the central claim?','Essays':'Where does the writer move from observation to argument?'};
function access(b){return b[4]?'<a class="readlink" target="_blank" rel="noopener" href="'+esc(b[4])+'">Read free online ↗</a>':'<a class="readlink" target="_blank" rel="noopener" href="https://search.worldcat.org/search?q='+encodeURIComponent(b[0]+' '+b[1])+'">Check library availability ↗</a>'}
function detail(i){let b=data[i];$('inside').innerHTML='<div class="tag">'+b[2]+'</div><h2>'+esc(b[0])+'</h2><span class="author">By '+esc(b[1])+'</span><p>'+esc(b[3])+'</p>'+access(b)+' <button class="action" id="modalSave">'+(saved.has(i)?'Remove from my shelf':'+ Save to my shelf')+'</button><br><a target="_blank" rel="noopener" href="https://openlibrary.org/search?q='+encodeURIComponent(b[0]+' '+b[1])+'">Find editions on Open Library ↗</a>';const flip=document.createElement('button');flip.className='flip';flip.setAttribute('aria-label','Turn jacket to see the reading prompt');flip.setAttribute('aria-pressed','false');const prompt=prompts[b[2]]||'Which passage would you return to, and what draws you back?';flip.innerHTML='<span class="flipbody"><span class="face">'+jacket(i)+'</span><span class="back"><em>Reading prompt</em>'+prompt+'</span></span><span class="turn">↻ Turn jacket</span>';flip.onclick=()=>{let turned=flip.classList.toggle('turned');flip.setAttribute('aria-pressed',turned);flip.setAttribute('aria-label',turned?'Turn jacket to see the cover':'Turn jacket to see the reading prompt')};$('inside').prepend(flip);draw(flip);const editions=document.createElement('details');editions.innerHTML='<summary>Browse editions</summary><div class="editionResults" aria-live="polite"></div>';$('inside').append(editions);editions.ontoggle=()=>{if(editions.open&&!editions.dataset.loaded){editions.dataset.loaded='1';loadEditions(i,editions.querySelector('div'))}};$('modalSave').onclick=()=>{toggle(i);detail(i);$('modalSave').focus()};if(!$('detail').open)$('detail').showModal()}
function view(v){own=v;category=cats[0];$('query').value='';render();$('catalog').scrollIntoView()}
$('discover').onclick=()=>view(false);$('shelf').onclick=()=>view(true);$('query').oninput=render;$('sort').onchange=render;$('chips').onclick=e=>{if(e.target.tagName==='BUTTON'){category=e.target.textContent;render();$('chips').querySelector('[aria-pressed=true]').focus()}};$('grid').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open!==undefined)detail(+b.dataset.open);else if(b.dataset.save!==undefined){toggle(+b.dataset.save);$('grid').querySelector('[data-save="'+b.dataset.save+'"]')?.focus()}else view(false)};$('next').onclick=()=>{featured=(featured+1)%3;hero()};$('prev').onclick=()=>{featured=(featured+2)%3;hero()};document.querySelector('.close').onclick=()=>$('detail').close();$('detail').setAttribute('aria-label','Book details');function layout(list){$('grid').classList.toggle('listmode',list);$('list').setAttribute('aria-pressed',list);$('tiles').setAttribute('aria-pressed',!list)}
$('tiles').onclick=()=>layout(false);$('list').onclick=()=>layout(true);$('surprise').onclick=()=>{let pool=filtered.filter(i=>i!==lastPick);if(!pool.length)pool=filtered;if(pool.length){lastPick=pool[Math.floor(Math.random()*pool.length)];detail(lastPick)}};

const modes=['tiles','list','shelflayout','journal'];for(const m of modes)$(m).onclick=()=>{for(const k of modes)$(k).setAttribute('aria-pressed',k===m);$('grid').className='grid '+({list:'listmode',journal:'journalmode',shelflayout:'casemode'}[m]||'')};
$('design').onchange=()=>{document.body.dataset.theme=$('design').value};$('collection').onchange=()=>{category=cats[0];render()};
for(const [id,delta] of [['backPage',-1],['nextPage',1]])$(id).onclick=()=>{page+=delta;render();$('catalog').scrollIntoView()};
hero();render();
</script></html>
