<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Counting House</title>
<meta name="description" content="A personal budget and finance tracker: log income and expenses by category, watch spending trends, and set monthly limits with a visual burn-down.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  :root {
    color-scheme: light;
    --bg: #F4F6F1;
    --panel: #FFFFFF;
    --panel-2: #F3F5EE;
    --ink: #16201A;
    --ink-2: #58635A;
    --muted: #879189;
    --line: #E4E8DE;
    --line-2: #D3D9CC;

    --chart-surface: #FCFCFB;
    --grid: #E4E3DB;
    --axis: #C3C2B7;

    --accent: #2A78D6;
    --accent-ink: #1C5CAB;
    --accent-soft: #E5EFFA;

    --pos: #0B7A3D;
    --pos-soft: #E3F1E7;
    --neg: #C1362E;
    --neg-soft: #F8E7E4;
    --warn: #A9711A;
    --warn-soft: #F6EDDA;

    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --c0: #8b958c;

    --shadow: 0 1px 2px rgba(18,28,18,.05), 0 14px 38px rgba(18,28,18,.07);
    --radius: 14px;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0D0F0D;
      --panel: #171A16;
      --panel-2: #1F241E;
      --ink: #E9EDE4;
      --ink-2: #A6AFA3;
      --muted: #808A81;
      --line: #292E27;
      --line-2: #3A403A;
      --chart-surface: #1a1a19;
      --grid: #2c2c2a;
      --axis: #383835;
      --accent: #3987e5;
      --accent-ink: #86b6ef;
      --accent-soft: #17273A;
      --pos: #46C079; --pos-soft: #16301F;
      --neg: #E86B62; --neg-soft: #371D1B;
      --warn: #E0A257; --warn-soft: #322715;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #2a9d2a; --c7: #9085e9; --c8: #e66767;
      --c0: #808a81;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0D0F0D;
    --panel: #171A16;
    --panel-2: #1F241E;
    --ink: #E9EDE4;
    --ink-2: #A6AFA3;
    --muted: #808A81;
    --line: #292E27;
    --line-2: #3A403A;
    --chart-surface: #1a1a19;
    --grid: #2c2c2a;
    --axis: #383835;
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-soft: #17273A;
    --pos: #46C079; --pos-soft: #16301F;
    --neg: #E86B62; --neg-soft: #371D1B;
    --warn: #E0A257; --warn-soft: #322715;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #2a9d2a; --c7: #9085e9; --c8: #e66767;
    --c0: #808a81;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 44px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { max-width: 1120px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 30px) 90px; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 0 12px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--serif); font-weight: 600; font-size: 22px;
    letter-spacing: -.01em; color: var(--ink);
  }
  .wordmark .coin {
    width: 20px; height: 20px; border-radius: 999px;
    background: radial-gradient(circle at 32% 30%, var(--c4), #b97d05);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    align-self: center; flex: none;
  }
  .spacer { flex: 1 1 auto; }

  .monthnav { display: flex; align-items: center; gap: 4px; }
  .monthnav .mlabel {
    min-width: 148px; text-align: center;
    font-weight: 600; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .iconbtn {
    display: grid; place-items: center;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--line-2); background: var(--panel);
    color: var(--ink-2); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--muted); }
  .iconbtn:disabled { opacity: .35; cursor: default; }
  .iconbtn svg { width: 16px; height: 16px; }

  .tabs { display: flex; gap: 2px; padding: 4px; background: var(--panel-2); border-radius: 11px; border: 1px solid var(--line); }
  .tabs button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-weight: 600; font-size: 13px;
    color: var(--ink-2); padding: 7px 14px; border-radius: 8px;
    transition: background .15s, color .15s;
  }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  h2.view-title {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(20px, 3vw, 26px); margin: 26px 0 4px; letter-spacing: -.01em;
  }
  .view-sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 18px; }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: clamp(14px, 2.2vw, 20px);
  }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 860px) { .grid.cols-2 { grid-template-columns: 1fr 1fr; } .grid.cols-32 { grid-template-columns: 3fr 2fr; } }

  .panel-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .panel-head h3 { font-family: var(--serif); font-weight: 600; font-size: 16px; margin: 0; flex: 1 1 auto; }
  .panel-head .hint { color: var(--muted); font-size: 12px; font-weight: 400; }

  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--panel); cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2);
    padding: 5px 10px; transition: background .15s, color .15s;
  }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0c1116; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0c1116; } }

  /* ---------- stat tiles ---------- */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 720px) { .tiles { grid-template-columns: repeat(5, 1fr); } }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 14px;
    display: flex; flex-direction: column; gap: 3px; min-width: 0;
  }
  .tile .t-label { font-size: 11.5px; color: var(--ink-2); font-weight: 500; letter-spacing: .01em; }
  .tile .t-value { font-size: clamp(19px, 3vw, 23px); font-weight: 600; letter-spacing: -.015em; }
  .tile.hero { grid-column: span 2; }
  @media (min-width: 720px) { .tile.hero { grid-column: span 1; } }
  .tile.hero .t-value { font-size: clamp(26px, 4vw, 33px); }
  .t-delta { font-size: 11.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; margin-top: 1px; }
  .t-delta.up { color: var(--pos); }
  .t-delta.down { color: var(--neg); }
  .t-delta.flat { color: var(--muted); }
  .val-pos { color: var(--pos); }
  .val-neg { color: var(--neg); }
  .spark { margin-top: 4px; }

  /* ---------- legend / table ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
  .legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .legend .sw.line { height: 3px; border-radius: 2px; width: 15px; }

  table.dv { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.dv th, table.dv td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.dv th:first-child, table.dv td:first-child { text-align: left; }
  table.dv th { color: var(--muted); font-weight: 600; }
  table.dv tfoot td { font-weight: 600; border-bottom: 0; border-top: 2px solid var(--line-2); }
  .tablewrap { overflow-x: auto; }

  .chart-host { width: 100%; position: relative; }
  .chart-host svg { display: block; width: 100%; height: auto; }
  .chart-host text { font-family: var(--font); }

  /* ---------- meters ---------- */
  .meter-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .meter-row:last-child { border-bottom: 0; }
  .meter-top { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
  .meter-top .m-name { font-weight: 600; flex: 1 1 auto; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .meter-top .m-fig { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; }
  .track { position: relative; height: 9px; border-radius: 5px; background: var(--panel-2); margin-top: 7px; overflow: hidden; border: 1px solid var(--line); }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .5s cubic-bezier(.3,.8,.3,1); }
  .track .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
  .meter-foot { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11.5px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
  .pill.ok { background: var(--pos-soft); color: var(--pos); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.over { background: var(--neg-soft); color: var(--neg); }
  .pill svg { width: 11px; height: 11px; }

  /* ---------- forms ---------- */
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  input, select {
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px;
    padding: 9px 10px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn {
    font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
    border-radius: 9px; padding: 9px 16px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--muted); }
  .btn.danger { background: transparent; color: var(--neg); border-color: color-mix(in srgb, var(--neg) 45%, var(--line-2)); }

  .typetoggle { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .typetoggle button { border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 13px; color: var(--ink-2); padding: 7px 16px; border-radius: 7px; cursor: pointer; }
  .typetoggle button[aria-pressed="true"][data-t="expense"] { background: var(--neg); color: #fff; }
  .typetoggle button[aria-pressed="true"][data-t="income"] { background: var(--pos); color: #fff; }

  .addgrid { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .addgrid { grid-template-columns: 120px 1fr 1fr 130px auto; align-items: end; } }

  /* ---------- transactions ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .filters select, .filters input { width: auto; min-width: 130px; }
  .txn-day { margin-top: 16px; }
  .txn-day h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 2px; letter-spacing: .02em; text-transform: uppercase; }
  .txn {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--line);
  }
  .txn .t-cat { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; }
  .txn .t-note { color: var(--muted); font-size: 12.5px; }
  .txn .t-amt { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
  .txn .del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
  .txn .del:hover { color: var(--neg); background: var(--neg-soft); }
  .empty { text-align: center; color: var(--ink-2); padding: 34px 10px; font-size: 13.5px; }
  .empty strong { display: block; font-family: var(--serif); font-size: 17px; color: var(--ink); margin-bottom: 3px; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 60; pointer-events: none; opacity: 0;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 10px;
    box-shadow: var(--shadow); padding: 9px 11px; font-size: 12px;
    min-width: 130px; transition: opacity .12s;
  }
  #tip .tt-head { font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  #tip .tt-row { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; }
  #tip .tt-row .k { width: 12px; height: 3px; border-radius: 2px; flex: none; }
  #tip .tt-row .lb { color: var(--ink-2); flex: 1 1 auto; }
  #tip .tt-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---------- settings ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,14,10,.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; width: 100%; max-width: 420px; }
  .modal h3 { font-family: var(--serif); margin: 0 0 14px; font-size: 18px; }
  .modal .row { display: flex; gap: 10px; margin-top: 12px; }

  .cat-manage { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .cat-manage .cm {
    display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .cat-manage .cm input { padding: 6px 8px; font-size: 13px; }
  .cat-manage .cm .cname { display: flex; align-items: center; gap: 7px; min-width: 0; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>

<div class="app">
  <div class="topbar">
    <div class="wordmark"><span class="coin" aria-hidden="true"></span>Counting House</div>
    <div class="spacer"></div>
    <div class="monthnav">
      <button class="iconbtn" id="mPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="mlabel num" id="mLabel">—</span>
      <button class="iconbtn" id="mNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.61.79 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>

  <div class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="overview" aria-selected="true">Overview</button>
    <button role="tab" data-view="budgets" aria-selected="false">Budgets</button>
    <button role="tab" data-view="ledger" aria-selected="false">Transactions</button>
  </div>

  <main id="view"></main>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ============ constants ============ */
  var STORE = "counting-house-v1";
  var THEME_KEY = "counting-house-theme";
  var CAT_COLORS = ["var(--c0)", "var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ============ utilities ============ */

      else if (attrs[k] != null) n.setAttribute(k, attrs[k]);

  }
  var svgEl = function (tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) if (attrs[k] != null) {
      var v = (k === "fill" || k === "stroke") ? resolveColor(attrs[k]) : attrs[k];
      n.setAttribute(k, v);
    }
    return n;
  };

  function ym(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function monthShift(key, n) { var p = key.split("-"); var d = new Date(+p[0], +p[1] - 1 + n, 1); return ym(d); }

  /* ============ seed ============ */
  function seed() {

      { id: "refund", name: "Refunds & other", type: "income", limit: null, color: 0 }
    ];
    var s = 20260909, rnd = function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    var rint = function (a, b) { return Math.floor(a + rnd() * (b - a + 1)); };

    var txns = [], id = 0;

      txns.push({ id: "t" + (id++), date: p[0] + "-" + p[1] + "-" + String(d).padStart(2, "0"), amount: amount, cat: cat, type: type, note: note });
    };
    var groceryNotes = ["Whole Foods", "Corner market", "Trader Joe's", "Farmers market"];
    var dineNotes = ["Lunch with team", "Thai takeout", "Coffee & pastry", "Pizza night", "Brunch"];
    var months = [];
    for (var i = 5; i >= 0; i--) months.push(monthShift(here, -i));
    var isCur = function (m) { return m === here; };
    var maxDay = function (m) { return isCur(m) ? new Date().getDate() : daysIn(m); };
    months.forEach(function (m, mi) {
      var md = maxDay(m);
      add(m, 2, 1500, "rent", "expense", "Monthly rent");
      if (md >= 1) add(m, 1, 2120, "sal", "income", "Paycheck");
      if (md >= 15) add(m, 15, 2120, "sal", "income", "Paycheck");
      [3, 9, 16, 23, 29].forEach(function (d) { if (d <= md) add(m, d, rf(58, 132), "groc", "expense", groceryNotes[rint(0, 3)]); });
      [4, 8, 12, 17, 21, 26].forEach(function (d) { if (d <= md && rnd() > .25) add(m, d, rf(11, 42), "dine", "expense", dineNotes[rint(0, 4)]); });
      [6, 14, 22, 28].forEach(function (d) { if (d <= md) add(m, d, rf(14, 52), "tran", "expense", rnd() > .5 ? "Gas station" : "Transit pass"); });
      if (md >= 5) add(m, 5, rf(88, 140), "util", "expense", "Electricity");

      if (md >= 7 && rnd() > .3) add(m, 7, rf(35, 95), "heal", "expense", rnd() > .5 ? "Gym membership" : "Pharmacy");
      [11, 24].forEach(function (d) { if (d <= md && rnd() > .35) add(m, d, rf(16, 65), "fun", "expense", rnd() > .5 ? "Cinema" : "Concert tickets"); });
      if (rnd() > .45 && md >= 13) add(m, 13, rf(40, 190), "shop", "expense", "Clothing & home");

      if (md >= Math.min(27, md)) add(m, Math.min(27, md), rf(9, 21), "int", "income", "Savings interest");
      if ((mi === 1 || mi === 3 || mi === 5) && md >= 20) add(m, 20, rf(240, 620), "free", "income", "Side project invoice");
      if (rnd() > .7 && md >= 10) add(m, 10, rf(15, 70), "refund", "income", "Store refund");
    });

  /* ============ derivations ============ */
  function catById(id) { for (var i = 0; i < S.categories.length; i++) if (S.categories[i].id === id) return S.categories[i]; return { id: id, name: "Uncategorised", type: "expense", color: 0, limit: null }; }
  function catColor(c) { return CAT_COLORS[(c && c.color) || 0]; }

  function sum(arr, f) { return arr.reduce(function (a, t) { return a + (f ? f(t) : t); }, 0); }

  }
  function foldTop(rows, n) {

  /* ============ chart: columns (grouped / stacked) ============ */
  function columnChart(host, opts) {
    // opts: groups [{key,label, parts:[{k,label,color,value}]}], series [{k,label,color}], stacked, yFmt
    host.innerHTML = "";
    var W = Math.max(280, host.clientWidth), H = 250;
    var m = { l: 52, r: 14, t: 12, b: 26 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var groups = opts.groups, series = opts.series;
    var maxV = 0;
    groups.forEach(function (g) {
      if (opts.stacked) maxV = Math.max(maxV, sum(g.parts, function (p) { return p.value; }));
      else g.parts.forEach(function (p) { maxV = Math.max(maxV, p.value); });
    });
    var top = niceMax(maxV || 1);
    var y = function (v) { return m.t + ph - (v / top) * ph; };
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.aria || "column chart" });

    for (var i = 0; i <= 4; i++) {
      var gv = top * i / 4, gy = y(gv);
      svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: gy, y2: gy, stroke: "var(--grid)", "stroke-width": 1 }));
      svg.appendChild(svgEl("text", { x: m.l - 8, y: gy + 3, "text-anchor": "end", "font-size": 10.5, fill: "var(--muted)" })).textContent = money(gv);
    }
    var band = pw / groups.length;
    var innerGap = 2;
    var groupW = Math.min(opts.stacked ? 24 : 30, band * 0.62);

    groups.forEach(function (g, gi) {
      var cx = m.l + band * gi + band / 2;
      if (opts.stacked) {
        var acc = 0;
        var visible = g.parts.filter(function (p) { return p.value > 0; });
        visible.forEach(function (p, pi) {
          var h = (p.value / top) * ph;
          if (h < 0.5) { acc += p.value; return; }
          var y0 = y(acc + p.value), y1 = y(acc);
          var hh = Math.max(1, y1 - y0 - (pi < visible.length - 1 ? innerGap : 0));
          var isTop = pi === visible.length - 1;
          svg.appendChild(barPath(cx - groupW / 2, y0, groupW, hh, isTop ? 4 : 1, p.color));
          acc += p.value;
        });
      } else {
        var n = g.parts.length;
        var bw = Math.min(24, (groupW - innerGap * (n - 1)) / n);
        var startX = cx - (bw * n + innerGap * (n - 1)) / 2;
        g.parts.forEach(function (p, pi) {
          var h = Math.max(1, (p.value / top) * ph);
          svg.appendChild(barPath(startX + pi * (bw + innerGap), y(p.value), bw, h, 4, p.color));
        });

      svg.appendChild(svgEl("text", { x: cx, y: H - 8, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" })).textContent = g.label;

      var showG = function (ev) {
        var r = svg.getBoundingClientRect();
        var rows = g.parts.slice().reverse().filter(function (p) { return p.value > 0; }).map(function (p) { return { color: p.color, label: p.label, value: money(p.value) }; });
        if (opts.stacked) rows.push({ label: "Total", value: money(sum(g.parts, function (p) { return p.value; })) });
        var cxp = ev.clientX || (r.left + m.l + band * gi + band / 2);
        showTip(cxp, r.top + m.t + 10, g.label, rows);
        Array.prototype.forEach.call(svg.querySelectorAll("[data-bar]"), function (b) { b.style.opacity = ""; });
      };
      hit.addEventListener("pointermove", showG);
      hit.addEventListener("pointerenter", showG);
      hit.addEventListener("focus", showG);
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("blur", hideTip);

  function barPath(x, y, w, h, r, color) {

          catsWrap.appendChild(el("div", { class: "cm" }, [
            el("span", { class: "cname" }, [el("span", { class: "dot", style: "background:" + catColor(c) }), nameI]),
            limI,
            el("button", { class: "del", "aria-label": "Delete " + c.name, title: "Delete", onclick: function () {
              if (S.txns.some(function (t) { return t.cat === c.id; })) { if (!confirm("Delete \"" + c.name + "\" and its " + S.txns.filter(function (t) { return t.cat === c.id; }).length + " transaction(s)?")) return; S.txns = S.txns.filter(function (t) { return t.cat !== c.id; }); }
              S.categories = S.categories.filter(function (x) { return x.id !== c.id; }); save(); drawCats(); render();
            } }, ["×"])
          ]));
        });
        var newI = el("input", { placeholder: "Add " + (type === "expense" ? "category" : "source") + "…" });
        var addBtn = el("button", { class: "btn ghost", style: "padding:6px 12px", onclick: function () {
          var v = newI.value.trim(); if (!v) return;
          var used = S.categories.map(function (x) { return x.color; });
          var color = 0; for (var i = 1; i <= 8; i++) if (used.indexOf(i) === -1) { color = i; break; }
          S.categories.push({ id: "c" + Date.now().toString(36), name: v, type: type, limit: null, color: color });
          save(); newI.value = ""; drawCats(); render();
        } }, ["Add"]);
        catsWrap.appendChild(el("div", { class: "cm" }, [el("span", { class: "cname" }, [newI]), el("span", {}), addBtn]));
      });
    }
    drawCats();

    var modal = el("div", { class: "modal" }, [
      el("h3", { text: "Settings" }),
      el("label", { class: "field", style: "flex-direction:row;align-items:center;gap:10px" }, ["Currency symbol", symI]),
      el("div", { style: "margin-top:6px" }, [catsWrap]),
      el("div", { class: "row" }, [
        el("button", { class: "btn ghost", onclick: function () {
          try { navigator.clipboard.writeText(JSON.stringify(S, null, 2)); } catch (e) {}
        } }, ["Copy data (JSON)"]),
        el("button", { class: "btn danger", onclick: function () {
          if (confirm("Reset everything and reload sample data?")) { S = seed(); save(); bg.remove(); render(); }
        } }, ["Reset to sample"])
      ]),
      el("div", { class: "row" }, [el("button", { class: "btn", style: "flex:1", onclick: function () { S.settings.symbol = symI.value.trim() || "$"; save(); bg.remove(); render(); } }, ["Done"])])
    ]);
    var bg = el("div", { class: "modal-bg", onclick: function (e) { if (e.target === bg) { S.settings.symbol = symI.value.trim() || "$"; save(); bg.remove(); render(); } } }, [modal]);
    document.body.appendChild(bg);
    if (focus === "cats") catsWrap.scrollIntoView({ block: "center" });
  }

  /* ============ theme ============ */
  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    $("#themeIcon").innerHTML = dark ? SUN : MOON;
  }
  var savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme);
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var now = cur || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = now === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next); render();
  });
  $("#settingsBtn").addEventListener("click", function () { openSettings(); });

  /* ============ nav ============ */
  $("#mPrev").addEventListener("click", function () { curMonth = monthShift(curMonth, -1); render(); });
  $("#mNext").addEventListener("click", function () { curMonth = monthShift(curMonth, 1); render(); });
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
    b.addEventListener("click", function () { view = b.dataset.view; render(); });
  });

  var rt;
  addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 160); });

  /* ============ main render ============ */
  function render() {
    $("#mLabel").textContent = monthName(curMonth);
    $("#mNext").disabled = curMonth >= monthShift(ym(new Date()), 6);
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.view === view));
    });
    var host = $("#view");
    host.innerHTML = "";
    var titles = {
      overview: ["The month at a glance", "Income, spending and what is left over."],
      budgets: ["Budgets & burn-down", "How fast this month's money is going."],
      ledger: ["Transactions", "Every dollar in and out."]
    };
    host.appendChild(el("h2", { class: "view-title", text: titles[view][0] }));
    host.appendChild(el("p", { class: "view-sub", text: titles[view][1] }));
    var root = el("div");
    host.appendChild(root);
    if (view === "overview") renderOverview(root);
    else if (view === "budgets") renderBudgets(root);
    else renderLedger(root);
  }

  render();
})();
</script>

</body></html>
