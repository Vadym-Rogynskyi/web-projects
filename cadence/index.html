      card.appendChild(el("div", { class: "track" }, [el("div", { class: "fill", style: "width:" + (doneCount / act.week.length * 100) + "%" })]));
      act.week.forEach(function (s, i) {
        var chk = el("input", { type: "checkbox", checked: S.programs.done[wkNum + "-" + i] ? "" : null, onchange: function (e) { S.programs.done[wkNum + "-" + i] = e.target.checked; save(); render(); } });
        card.appendChild(el("label", { class: "sess" }, [chk, el("div", {}, [el("div", { style: "font-weight:600", text: s.d }), s.s ? el("div", { class: "sd", text: s.s }) : null])]));
      });
      if (act.notes) card.appendChild(el("p", { style: "margin-top:10px;font-size:12px;color:var(--muted)", text: "Note: " + act.notes }));
      card.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [el("button", { class: "btn sm ghost", onclick: function () { if (confirm("Leave this program?")) { S.programs.active = null; save(); render(); } } }, ["Leave program"])]));
      pp.appendChild(card);
    } else {
      pp.appendChild(el("p", { style: "color:var(--muted);font-size:13px;margin-top:0", text: "Pick a structured plan to follow. It shows this week's sessions here — tick them off as you go." }));
    }
    var lib = el("div", { class: "grid c2", style: "margin-top:14px" });
    Object.keys(PROGRAMS).forEach(function (k) {
      if (S.programs && S.programs.active === k) return;
      var pr = PROGRAMS[k];
      lib.appendChild(el("div", { class: "prog-card" }, [
        el("h4", { text: pr.name }),
        el("div", { class: "meta", text: pr.weeks + " weeks · " + pr.dpw + "×/week · " + pr.focus }),
        el("p", { text: pr.desc }),
        el("button", { class: "btn sm", onclick: function () { S.programs = { active: k, started: isoDay(new Date()), done: {} }; save(); render(); } }, ["Start " + pr.name])
      ]));
    });
    pp.appendChild(lib);
    root.appendChild(pp);

    /* body & fat loss */
    var pb = el("div", { class: "panel", style: "margin-top:16px" });
    pb.appendChild(el("div", { class: "p-head" }, [el("h2", { text: "Body & energy" }), el("span", { style: "flex:1" }), el("button", { class: "btn sm ghost", onclick: logBody }, ["+ Log weight"])]));
    var lw = latestWeight();
    var st = S.settings;
    var bmr = 10 * (lw || 75) + 6.25 * (st.height || 175) - 5 * (st.age || 30) + (st.sex === "m" ? 5 : st.sex === "f" ? -161 : -78);
    var tdee = bmr * (st.activity || 1.5);
    pb.appendChild(el("div", { class: "tiles" }, [
      tile("Current weight", lw ? fmtW(lw, 1).split(" ")[0] : "—", lw ? wUnit() : ""),
      tile("Est. maintenance", Math.round(tdee).toLocaleString(), "kcal/day"),
      tile("BMR", Math.round(bmr).toLocaleString(), "kcal/day"),
      tile("7-day trend", bwTrend(), "")
    ]));
    var rate = ui.flRate || 0.5;
    var rI = el("input", { type: "range", min: "0", max: "1", step: "0.05", value: rate, style: "accent-color:var(--accent)" });
    var out = el("div", { style: "margin-top:8px" });
    function fillFl() {
      var r = +rI.value; ui.flRate = r;
      var kcal = Math.round(tdee - r * 1100);
      var floor = Math.round(Math.max(bmr * 1.05, metric() ? 1400 : 1400));
      out.innerHTML = "";
      out.appendChild(el("div", { style: "display:flex;align-items:baseline;gap:10px;flex-wrap:wrap" }, [
        el("span", { class: "cond", style: "font-size:30px", text: r === 0 ? "maintain" : (Math.round(kgTo(r) * 100) / 100 || r) + " " + wUnit() + "/wk" }),
        el("span", { style: "color:var(--ink-2);font-size:13px", text: r === 0 ? "eat around maintenance" : "eat about" }),
        r === 0 ? null : el("span", { class: "cond", style: "font-size:24px", text: Math.max(kcal, floor).toLocaleString() + " kcal" })
      ]));
      var gw = (S.goals.filter(function (g) { return g.kind === "bodyweight"; })[0] || {});
      if (r > 0 && lw && gw.target && lw > gw.target) {
        var wks = (lw - gw.target) / r;
        var eta = new Date(); eta.setDate(eta.getDate() + Math.round(wks * 7));
        out.appendChild(el("p", { style: "font-size:12.5px;color:var(--ink-2);margin:8px 0 0", text: "At this rate you'd reach " + fmtW(gw.target, 0) + " around " + eta.toLocaleDateString(undefined, { month: "long", year: "numeric" }) + " (~" + Math.round(wks) + " weeks)." }));
      }
      var pct = lw ? r / lw * 100 : 0;
      out.appendChild(el("p", { style: "font-size:11.5px;color:var(--muted);margin:8px 0 0", text: (pct > 1 ? "⚠ That's over 1% of bodyweight per week — expect to lose muscle and strength. " : "") + "1 kg of fat ≈ 7,700 kcal. Protein 1.6–2.2 g/kg protects muscle in a deficit. Recalculate as your weight changes." }));
    }
    rI.addEventListener("input", fillFl);
    pb.appendChild(el("label", { class: "f", style: "margin-top:12px" }, ["Target rate of loss", rI]));
    pb.appendChild(out); fillFl();
    pb.appendChild(el("details", { style: "margin-top:12px" }, [
      el("summary", { style: "font-size:12.5px;font-weight:600;cursor:pointer", text: "Adjust your numbers" }),
      bodyNumbersForm()
    ]));
    root.appendChild(pb);
  }
  function bwTrend() {
    var bl = (S.body || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (bl.length < 2) return "—";
    var recent = bl.filter(function (b) { return daysBetween(parseD(b.date), new Date()) <= 14; });
    if (recent.length < 2) recent = bl.slice(0, 2);
    var d = recent[0].weight - recent[recent.length - 1].weight;
    var days = Math.max(1, daysBetween(parseD(recent[recent.length - 1].date), parseD(recent[0].date)));
    var perWk = d / days * 7;
    return (perWk >= 0 ? "+" : "−") + Math.abs(round1(kgTo(perWk))) + " " + wUnit();
  }
  function bodyNumbersForm() {
    var st = S.settings;
    function n(key, label, min, max, step) {
      var i = el("input", { type: "number", min: min, max: max, step: step || 1, value: st[key] });
      i.addEventListener("input", function () { st[key] = parseFloat(i.value) || st[key]; save(); });
      return el("label", { class: "f" }, [label, i]);
    }
    var sexSel = el("select", {}, [["avg", "Prefer not to say"], ["m", "Male"], ["f", "Female"]].map(function (o) { return el("option", { value: o[0], text: o[1], selected: st.sex === o[0] ? "" : null }); }));
    sexSel.addEventListener("change", function () { st.sex = sexSel.value; save(); render(); });
    var actSel = el("select", {}, [[1.2, "Sedentary"], [1.375, "Light (1–3×/wk)"], [1.55, "Moderate (3–5×/wk)"], [1.725, "Active (6–7×/wk)"], [1.9, "Very active / physical job"]].map(function (o) { return el("option", { value: o[0], text: o[1], selected: Math.abs((st.activity || 1.5) - o[0]) < 0.05 ? "" : null }); }));
    actSel.addEventListener("change", function () { st.activity = +actSel.value; save(); render(); });
    return el("div", { class: "grid c2", style: "margin-top:10px" }, [
      n("age", "Age", 12, 100), n("height", "Height (cm)", 120, 230),
      el("label", { class: "f" }, ["Biological sex (for BMR)", sexSel]),
      el("label", { class: "f" }, ["Daily activity", actSel])
    ]);
  }

  function goalCard(g) {
    var tw = thisWeek(), pct = 0, mainTxt = "", subTxt = "";
    if (g.kind === "weekly_distance") { var km = mTo(tw.runM); pct = g.target ? km / g.target * 100 : 0; mainTxt = round1(km) + " / " + g.target + " " + dUnit(); subTxt = "this week"; }
    else if (g.kind === "weekly_sessions") { pct = tw.sessions / g.target * 100; mainTxt = tw.sessions + " / " + g.target; subTxt = "sessions this week"; }
    else if (g.kind === "weekly_duration") { pct = tw.minutes / g.target * 100; mainTxt = tw.minutes + " / " + g.target + " min"; subTxt = "this week"; }
    else if (g.kind === "bodyweight") { var lw = latestWeight() || g.start; var span = g.start - g.target; pct = span ? (g.start - lw) / span * 100 : 0; mainTxt = fmtW(lw, 1) + " → " + fmtW(g.target, 0); subTxt = round1(Math.abs(kgTo(lw - g.target))) + " " + wUnit() + " to go"; }
    else if (g.kind === "e1rm") { var cur = 0; S.workouts.forEach(function (w) { var b = bestE1rm(w, g.exercise); if (b > cur) cur = b; }); pct = g.target ? cur / g.target * 100 : 0; mainTxt = fmtW(cur, 0) + " / " + fmtW(g.target, 0); subTxt = g.exercise + " est. 1RM"; }
    pct = clamp(pct, 0, 100);
    return el("div", { class: "goal" }, [
      el("div", { class: "goal-h" }, [
        el("div", { class: "ring", style: "--p:" + pct.toFixed(0) }, [el("span", { text: Math.round(pct) + "%" })]),
        el("div", { style: "flex:1" }, [el("div", { class: "gn", text: g.label }), el("div", { style: "font-size:12px;color:var(--ink-2)", text: mainTxt + " · " + subTxt })]),
        el("button", { class: "rm", style: "border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px", "aria-label": "Delete goal", onclick: function () { S.goals = S.goals.filter(function (x) { return x.id !== g.id; }); save(); render(); } }, ["×"])
      ]),
      el("div", { class: "track" }, [el("div", { class: "fill", style: "width:" + pct.toFixed(0) + "%" })])
    ]);
  }
  function addGoal() {
    var kind = el("select", {}, [["weekly_sessions", "Weekly sessions"], ["weekly_distance", "Weekly run distance (" + dUnit() + ")"], ["weekly_duration", "Weekly minutes"], ["bodyweight", "Reach a body weight"], ["e1rm", "Lift a target (est. 1RM)"]].map(function (o) { return el("option", { value: o[0], text: o[1] }); }));
    var target = el("input", { type: "number", min: "1", step: "0.5", placeholder: "target" });
    var exSel = el("select", { hidden: "" }, EXDB.filter(function (e) { return e[3] === "kg"; }).map(function (e) { return el("option", { value: e[0], text: e[0] }); }));
    kind.addEventListener("change", function () { exSel.hidden = kind.value !== "e1rm"; });
    var m = el("div", { class: "modal" }, [
      el("h3", { text: "New goal" }),
      el("label", { class: "f" }, ["Type", kind]),
      el("label", { class: "f", style: "margin-top:10px" }, ["Exercise", exSel]),
      el("label", { class: "f", style: "margin-top:10px" }, ["Target", target]),
      el("div", { class: "row", style: "margin-top:14px" }, [
        el("button", { class: "btn", onclick: function () {
          var t = parseFloat(target.value); if (!(t > 0)) { target.focus(); return; }
          var g = { id: "g" + Date.now().toString(36), kind: kind.value, target: kind.value === "e1rm" || kind.value === "bodyweight" ? toKg(t) : t };
          if (kind.value === "e1rm") { g.exercise = exSel.value; g.target = toKg(t); g.label = exSel.value + " e1RM " + fmtW(g.target, 0); }
          else if (kind.value === "bodyweight") { g.start = latestWeight() || toKg(t) + 5; g.label = "Reach " + fmtW(g.target, 0); }
          else if (kind.value === "weekly_distance") g.label = "Run " + t + " " + dUnit() + " / week";
          else if (kind.value === "weekly_sessions") g.label = t + " sessions / week";
          else g.label = t + " min / week";
          S.goals.push(g); save(); bg.remove(); render();
        } }, ["Add goal"]),
        el("button", { class: "btn ghost", onclick: function () { bg.remove(); } }, ["Cancel"])
      ])
    ]);
    var bg = el("div", { class: "modal-bg", onclick: function (e) { if (e.target === bg) bg.remove(); } }, [m]);
    document.body.appendChild(bg);
  }
  function logBody() {
    var wI = el("input", { type: "number", min: "20", step: "0.1", placeholder: wUnit(), value: latestWeight() ? round1(kgTo(latestWeight())) : "" });
    var dI = el("input", { type: "date", value: isoDay(new Date()) });
    var m = el("div", { class: "modal" }, [
      el("h3", { text: "Log body weight" }),
      el("div", { class: "grid c2" }, [el("label", { class: "f" }, ["Weight (" + wUnit() + ")", wI]), el("label", { class: "f" }, ["Date", dI])]),
      el("div", { class: "row", style: "margin-top:14px" }, [
        el("button", { class: "btn", onclick: function () {
          var v = parseFloat(wI.value); if (!(v > 0)) { wI.focus(); return; }
          if (!S.body) S.body = [];
          S.body = S.body.filter(function (b) { return b.date !== dI.value; });
          S.body.push({ date: dI.value, weight: toKg(v), note: "" });
          save(); bg.remove(); render();
        } }, ["Save"]),
        el("button", { class: "btn ghost", onclick: function () { bg.remove(); } }, ["Cancel"])
      ])
    ]);
    var bg = el("div", { class: "modal-bg", onclick: function (e) { if (e.target === bg) bg.remove(); } }, [m]);
    document.body.appendChild(bg);
  }

  /* ================= GPS RECORDER ================= */
  var rec = null;
  function openRecorder(sportKey) {
    rec = { sport: sportKey, points: [], dist: 0, start: 0, paused: true, pausedTotal: 0, pauseStart: 0, watchId: null, last: null };
    var ov = el("div", { class: "rec" });
    var map = el("div", { class: "rec-map" }); var cv = el("canvas"); map.appendChild(cv);
    var hud = el("div", { class: "rec-hud" });
    var msg = el("div", { class: "rec-msg", hidden: "" });
    map.appendChild(hud);
    var tEl, dEl, pEl;
    hud.appendChild(el("div", {}, [el("div", { class: "k", text: "Time" }), tEl = el("div", { class: "v", text: "0:00" })]));
    hud.appendChild(el("div", {}, [el("div", { class: "k", text: "Distance" }), dEl = el("div", { class: "v", text: "0.00 " + dUnit() })]));
    hud.appendChild(el("div", {}, [el("div", { class: "k", text: "Pace" }), pEl = el("div", { class: "v", text: "—" })]));
    var startBtn = el("button", { class: "big", style: "background:var(--accent);color:#fff" }, ["Start"]);
    var stopBtn = el("button", { class: "big", style: "background:var(--panel-2);color:var(--ink)" }, ["Discard"]);
    var ctl = el("div", { class: "rec-ctl" }, [startBtn, stopBtn]);
    ov.appendChild(map); ov.appendChild(msg); ov.appendChild(ctl);
    document.body.appendChild(ov);

    function redraw() { drawRoute(cv, rec.points, { color: spColor(sportKey), emptyText: "Waiting for GPS…" }); }
    redraw();
    var timer = setInterval(function () {
      if (rec.paused) return;
      var elapsed = (Date.now() - rec.start - rec.pausedTotal) / 1000;
      tEl.textContent = fmtClock(elapsed);
      dEl.textContent = fmtD(rec.dist, 2);
      if (rec.dist > 30) pEl.textContent = fmtPace(elapsed / (rec.dist / 1000));
    }, 500);

    function onPos(pos) {
      var c = pos.coords;
      if (c.accuracy > 45) return;
      var pt = { lat: c.latitude, lng: c.longitude, t: Date.now() };
      if (rec.last) { var dd = haversine(rec.last, pt); if (dd < 2.5) return; rec.dist += dd; }
      rec.last = pt; rec.points.push(pt); redraw();
    }
    function onErr(e) { msg.hidden = false; msg.textContent = "GPS: " + (e.message || "unavailable") + ". You can still time this and enter the distance after."; }

    startBtn.addEventListener("click", function () {
      if (!navigator.geolocation) { onErr({ message: "not supported" }); }
      if (rec.paused && !rec.start) {
        rec.start = Date.now(); rec.paused = false; startBtn.textContent = "Pause"; stopBtn.textContent = "Finish"; stopBtn.style.background = "var(--accent)"; stopBtn.style.color = "#fff"; startBtn.style.background = "var(--warn)";
        try { rec.watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }); } catch (e) { onErr({ message: "blocked" }); }
      } else if (!rec.paused) {
        rec.paused = true; rec.pauseStart = Date.now(); startBtn.textContent = "Resume"; startBtn.style.background = "var(--accent)";
      } else {
        rec.pausedTotal += Date.now() - rec.pauseStart; rec.paused = false; startBtn.textContent = "Pause"; startBtn.style.background = "var(--warn)";
      }
    });
    stopBtn.addEventListener("click", function () {
      clearInterval(timer);
      if (rec.watchId != null) try { navigator.geolocation.clearWatch(rec.watchId); } catch (e) {}
      if (rec.start && (rec.dist > 20 || rec.points.length > 3)) {
        var elapsed = (Date.now() - rec.start - rec.pausedTotal) / 1000;
        draft = { type: sportKey, title: "", date: nowLocalInput(), mode: "distance", distance: Math.round(rec.dist), duration: Math.round(elapsed), route: rec.points.slice(), elevation: 0, notes: "", felt: null, rpe: null, location: null };
        draftEditId = null; view = "log";
        ov.remove(); rec = null; render();
        toast("Recorded " + fmtD(draft.distance, 2) + " — review and save");
      } else { ov.remove(); rec = null; }
    });
    requestAnimationFrame(redraw);
  }

  /* ================= settings / theme / boot ================= */
  function openSettings() {
    var unitSel = el("div", { class: "seg" }, [["metric", "Metric (kg · km)"], ["imperial", "Imperial (lb · mi)"]].map(function (o) {
      return el("button", { "aria-pressed": String((S.settings.units || "metric") === o[0]), onclick: function () { S.settings.units = o[0]; save(); document.querySelectorAll(".seg button").forEach(function () {}); bg.remove(); render(); openSettings(); } }, [o[1]]);
    }));
    var m = el("div", { class: "modal" }, [
      el("h3", { text: "Settings" }),
      el("label", { class: "f" }, ["Units", unitSel]),
      el("p", { style: "font-size:12.5px;color:var(--ink-2);margin:14px 0 0", text: "Everything is stored only in this browser. Location, when you use it, never leaves your device." }),
      el("div", { class: "row", style: "margin-top:14px" }, [
        el("button", { class: "btn ghost", onclick: function () { try { navigator.clipboard.writeText(JSON.stringify(S)); toast("Copied"); } catch (e) {} } }, ["Copy data"]),
        el("button", { class: "btn danger", onclick: function () { if (confirm("Reload the sample data?")) { S = seed(); save(); bg.remove(); render(); } } }, ["Reset to sample"]),
        el("button", { class: "btn danger", onclick: function () { if (confirm("Delete everything?")) { S = { workouts: [], body: [], goals: [], programs: { active: null, started: null, done: {} }, settings: S.settings }; save(); bg.remove(); render(); } } }, ["Clear all"])
      ]),
      el("div", { class: "row", style: "margin-top:12px" }, [el("button", { class: "btn wide", onclick: function () { bg.remove(); } }, ["Done"])])
    ]);
    var bg = el("div", { class: "modal-bg", onclick: function (e) { if (e.target === bg) bg.remove(); } }, [m]);
    document.body.appendChild(bg);
  }

  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    $("#themeIcon").innerHTML = dark ? SUN : MOON;
  }
  var savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme);
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var now = cur || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = now === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next); render();
  });
  $("#setBtn").addEventListener("click", openSettings);
  $("#fab").addEventListener("click", startLog);
  Array.prototype.forEach.call(document.querySelectorAll(".nav-tabs button"), function (b) {
    b.addEventListener("click", function () { view = b.dataset.view; draft = null; window.scrollTo(0, 0); render(); });
  });
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 180); });

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll(".nav-tabs button"), function (b) { b.setAttribute("aria-selected", String(b.dataset.view === view)); });
    $("#fab").style.display = (view === "log") ? "none" : "flex";
    var host = $("#view"); host.innerHTML = "";
    var root = el("div"); host.appendChild(root);
    if (view === "feed") renderFeed(root);
    else if (view === "log") renderLog(root);
    else if (view === "progress") renderProgress(root);
    else if (view === "plan") renderPlan(root);
  }
  render();

})();
</script>
