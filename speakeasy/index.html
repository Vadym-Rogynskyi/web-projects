  .empty { text-align: center; padding: 40px 16px; }

  .modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; width: 100%; max-width: 440px; margin: auto; }

      el("div", { class: "cl", text: "A small fix" }),
      el("div", { class: "cf", text: entry.correction, dir: "auto" }),
      entry.correction_note ? el("div", { text: entry.correction_note }) : null
    ]));
    return row;
  }
  function typingRow(session) {
    var row = el("div", { class: "bubble-row" });
    row.appendChild(el("div", { class: "bavatar", style: "background:" + LEVEL[session.level].color, html: catIcon(SCEN[session.scenarioKey].cat, 15) }));
    row.appendChild(el("div", { class: "bubble" }, [el("div", { class: "txt" }, [el("div", { class: "typing" }, [el("span"), el("span"), el("span")])])]));
    return row;
  }
  function errorNotice(e) {
    var box = el("div", { class: "notice " + (isPermanent(e.code) ? "alert" : "warn") }, [errCopy(e.code)]);
    if (!isPermanent(e.code) && e.code !== "refused" && e.code !== "empty_completion") {
      box.appendChild(el("div", { style: "margin-top:8px" }, [el("button", { class: "btn sm", onclick: function () { ui.lastError = null; sendTurn(null); } }, ["Try again"])]));
    } else if (e.code === "refused" || e.code === "empty_completion") {
      box.appendChild(el("div", { style: "margin-top:8px;font-size:12px", text: "Try rephrasing your last message and send it again." }));
    }
    return box;
  }

  function translatePanel() {
    if (!translateState.open) return el("div");
    var s = LANG[S.settings.support], t = LANG[S.settings.target];
    var inputI = el("input", { placeholder: "A word or phrase in " + s.en + " or " + t.en + "…", value: translateState.input, dir: "auto" });
    inputI.addEventListener("input", function () { translateState.input = inputI.value; });
    function go() {
      var v = inputI.value.trim(); if (!v) return;
      translateState.error = null; translateState.result = null;
      runTranslate(v, function (data) { translateState.result = data; }, function (e) { translateState.error = e; });
    }
    inputI.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    var panel = el("div", { class: "panel", style: "margin-bottom:8px" }, [
      el("div", { class: "row" }, [inputI, el("button", { class: "btn sm", disabled: translateBusy ? "" : null, onclick: go }, [translateBusy ? "…" : "Translate"])])
    ]);
    if (translateState.result) {
      var r = translateState.result;
      panel.appendChild(el("div", { style: "margin-top:10px" }, [
        el("div", { style: "font-weight:800;font-family:var(--chatfont);font-size:15px", text: (typeof r.translation === "string" ? r.translation : "…"), dir: "auto" }),
        r.note ? el("div", { style: "color:var(--muted);font-size:12.5px;margin-top:3px", text: r.note }) : null
      ]));
    }
    if (translateState.error) panel.appendChild(el("div", { style: "margin-top:10px" }, [errorNotice(translateState.error)]));
    return panel;
  }

  /* ================= toast / theme / boot ================= */
  function toast(msg) {
    var el2 = el("div", { style: "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;font-weight:800;font-size:13px;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center", text: msg });
    document.body.appendChild(el2);
    setTimeout(function () { el2.style.opacity = "0"; el2.style.transition = "opacity .4s"; }, 2200);
    setTimeout(function () { el2.remove(); }, 2800);
  }
  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    $("#themeIcon").innerHTML = dark ? SUN : MOON;
  }
  var savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme);
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var now = cur || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = now === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next); render();
  });
  $("#vocabBtn").addEventListener("click", openVocabModal);

  function render() {
    var host = $("#view"); host.innerHTML = "";
    var root = el("div"); host.appendChild(root);
    if (S.session) { ui.view = "chat"; renderChat(root); } else { ui.view = "setup"; renderSetup(root); }
  }
  render();

})();
</script>

</body></html>
