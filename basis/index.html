<style>

      --ink: #E9EAF2; --ink-2: #A3A8BC; --muted: #767C91;
      --line: #252838; --line-2: #34394C;
      --accent: #6E8FF0; --accent-ink: #A9BDF7; --accent-soft: #1A2340;
      --invest: #B49BEC; --invest-ink: #D3C2F5; --invest-soft: #241C3B;
      --pos: #4FC787; --pos-soft: #14301F;
      --neg: #E5807A; --neg-soft: #35201E;
      --warn: #D9A857; --warn-soft: #302410;

      --c0:#9096AC; --c1:#5a97e6; --c2:#dd8c53; --c3:#3fc294; --c4:#dba934;

    --line: #252838; --line-2: #34394C;
    --accent: #6E8FF0; --accent-ink: #A9BDF7; --accent-soft: #1A2340;
    --invest: #B49BEC; --invest-ink: #D3C2F5; --invest-soft: #241C3B;

    --neg: #E5807A; --neg-soft: #35201E;

  @media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow-sm); padding: 12px 13px; }
  .tile.hero { grid-column: span 2; }
  @media (min-width: 700px) { .tile.hero { grid-column: span 1; } }
  .tile .k { font-size: 10.5px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .tile .v { font-weight: 800; font-size: clamp(20px, 3.4vw, 25px); line-height: 1.1; margin-top: 2px; letter-spacing: -.01em; }

  table.dv th { color: var(--muted); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .02em; }
  .tablewrap { overflow-x: auto; }

  #tip .h { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  #tip .r { display: flex; gap: 9px; padding: 1px 0; }

  .modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; width: 100%; max-width: 560px; margin: auto; }

  .taglabel { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 1px 5px; border-radius: 4px; margin-left: 6px; }
  .taglabel.fixed { background: var(--panel-2); color: var(--ink-2); }
  .taglabel.variable { background: var(--accent-soft); color: var(--accent-ink); }
  .taglabel.passive { background: var(--invest-soft); color: var(--invest-ink); }

  .prose { font-family: var(--serif); font-size: 16px; line-height: 1.65; color: var(--ink); max-width: 68ch; }
  .prose p { margin: 0 0 13px; }
  .prose em { color: var(--ink-2); }
  .lede { font-size: 17.5px; }
  .section-label { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h2.guide-h { font-size: clamp(19px, 3vw, 24px); margin: 32px 0 4px; font-family: var(--font); }
  h2.guide-h:first-of-type { margin-top: 4px; }
  .guide-sub { color: var(--ink-2); font-size: 13.5px; margin: 0 0 16px; max-width: 60ch; }
  .cards { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .cards.c3 { grid-template-columns: repeat(3, 1fr); } }
  .mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
  .mini h4 { margin: 0 0 5px; font-size: 14.5px; font-family: var(--font); }
  .mini p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .pullquote { font-family: var(--serif); font-style: italic; font-size: clamp(18px, 3vw, 22px); line-height: 1.4; border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin: 20px 0; max-width: 42ch; }
  .disclaimer { margin-top: 26px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 66ch; }

  .empty { text-align: center; padding: 40px 16px; }
  .empty h3 { font-size: 18px; margin-bottom: 6px; font-family: var(--font); }
  .empty p { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>

    '<h2 class="guide-h">A short order of operations</h2>',
    '<p class="guide-sub">Money is limited, so sequence matters. This is the order I\'d work through.</p>',
    '<div class="tablewrap"><table class="dv"><thead><tr><th>Step</th><th>Target</th><th>Why here</th></tr></thead><tbody>',
    trow("1 · See the real numbers", "A month of imported, categorized transactions", "Every decision after this is a guess without it."),
    trow("2 · Cover fixed costs, build a small buffer", "$1,000–$2,000 in cash", "Stops one surprise bill from becoming debt while you sort out the rest."),
    trow("3 · Clear high-interest debt", "Anything above ~7–8% APR", "A guaranteed, tax-free return equal to the rate — nothing else on this list beats it."),
    trow("4 · Full emergency fund + employer match", "3–6 months of essentials, 100% of any match", "The safety net, plus free money you forgo every month you skip it."),
    trow("5 · Automate investing", "A fixed % of income, every payday", "Consistency beats timing. Let dividends and interest compound quietly in the background."),
    '</tbody></table></div>',

    '<h2 class="guide-h">Spending discipline: fixed vs. variable</h2>',
    '<div class="cards">',
    card("Audit fixed costs twice a year", "Subscriptions, insurance and phone/internet plans creep upward silently. A 20-minute call or a plan comparison often saves more than a month of careful grocery shopping."),
    card("Give variable spending a cap, not a ban", "A fixed weekly amount for dining and discretionary shopping means you never have to agonize over a single purchase — just stay inside the number."),
    card("Every fixed cost was once a choice", "A subscription added a year ago for one project is still billing today. Cancel-and-readd is free; forgetting to cancel isn\'t."),
    card("Negotiate before you cut", "Insurers and ISPs have retention offers they don\'t advertise. Ask before switching providers — it\'s usually faster and just as cheap."),
    '</div>',

    '<h2 class="guide-h">For businesses</h2>',
    '<p class="guide-sub">Running a business through this dashboard works the same way — with a few rules that matter more when money is shared with other people\'s expectations.</p>',
    '<div class="cards">',
    card("Never commingle", "Keep a dedicated business account from day one, even as a sole proprietor. It makes taxes, audits and this dashboard\'s numbers trustworthy."),
    card("Reserve for taxes immediately", "The moment revenue lands, move 25–30% (adjust to your bracket and structure) to a separate tax-reserve account. Treat it as already spent."),
    card("Pay yourself on a schedule", "An owner\'s draw or salary on a fixed cadence, sized to what the business can sustain — not what's left over on a good week."),
    card("Watch runway and burn rate", "Burn rate is monthly cash out minus cash in; runway is cash on hand ÷ burn rate. Know both numbers cold if the business isn\'t yet profitable."),
    card("Chase receivables", "An unpaid invoice is not cash. Follow up at 7, 14 and 30 days — the cost of asking is far lower than the cost of a bad debt."),
    card("Know your gross margin", "Revenue minus direct costs of delivering the work, divided by revenue. If it\'s trending down, growth is making the business more fragile, not less."),
    '</div>',

    '<h2 class="guide-h">When you notice this…</h2>',
    '<div class="tablewrap"><table class="dv"><thead><tr><th>Situation</th><th>What to do</th></tr></thead><tbody>',
    trow("Fixed costs are over ~55–60% of income", "Before cutting variable spending, attack the fixed layer — it compounds every single month."),
    trow("The uncategorized pile keeps growing", "Add two or three new rules from the biggest offenders; most CSVs converge to &lt;5% uncategorized after a month."),
    trow("A business account looks personal, or vice versa", "Move every mixed transaction to its own account this week — untangling six months later is much harder."),
    trow("Dividends show up but the portfolio value hasn\'t moved", "Check whether they\'re being reinvested automatically (DRIP) — update your holdings so the gain isn\'t invisible."),
    trow("Savings rate looks great, but cash on hand isn\'t growing", "Check the Investing tab — money may be leaving cash for contributions, which is progress, just not the number you were watching."),
    '</tbody></table></div>',

    '<p class="disclaimer">This is general educational information, not personalised financial, tax, accounting or legal advice. Categorization is a starting point — review it. For decisions with real stakes, talk to a qualified accountant or fee-only fiduciary adviser.</p>'
  ].join("");

  /* ================= settings / theme / boot ================= */
  function openSettings() {
    var symI = el("input", { value: S.settings.symbol, maxlength: "3", style: "width:70px" });
    var bizI = el("input", { value: S.settings.businessName || "" });
    var m = el("div", { class: "modal" }, [
      el("h3", { text: "Settings" }),
      el("div", { class: "grid c2" }, [el("label", { class: "f" }, ["Currency symbol", symI]), el("label", { class: "f" }, ["Business name", bizI])]),
      el("p", { style: "font-size:12.5px;color:var(--ink-2);margin:14px 0 0", text: "Everything — accounts, transactions, rules, holdings — is stored only in this browser." }),
      el("div", { class: "row", style: "margin-top:14px" }, [
        el("button", { class: "btn ghost", onclick: function () { try { navigator.clipboard.writeText(JSON.stringify(S)); toast("Copied"); } catch (e) {} } }, ["Copy data"]),
        el("button", { class: "btn danger", onclick: function () { if (confirm("Reload the sample data? This replaces everything.")) { S = seed(); save(); bg.remove(); render(); } } }, ["Reset to sample"]),
        el("button", { class: "btn danger", onclick: function () { if (confirm("Delete everything?")) { S = { accounts: [{ id: "a1", name: "Main account", type: "checking", business: false }], categories: CATDB.map(function (c, i) { return { id: c[0], name: c[1], kind: c[2], nature: c[3], passive: c[4], business: c[5], color: i % 9 }; }), rules: [], txns: [], startBalances: {}, holdings: [], settings: S.settings }; save(); bg.remove(); render(); } } }, ["Clear all"])
      ]),
      el("div", { class: "row", style: "margin-top:12px" }, [el("button", { class: "btn wide", onclick: function () { S.settings.symbol = symI.value.trim() || "$"; S.settings.businessName = bizI.value.trim(); save(); bg.remove(); render(); } }, ["Done"])])
    ]);
    var bg = el("div", { class: "modal-bg", onclick: function (e) { if (e.target === bg) bg.remove(); } }, [m]);
    document.body.appendChild(bg);
  }

  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    $("#themeIcon").innerHTML = dark ? SUN : MOON;
  }
  var savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme);
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var now = cur || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = now === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next); render();
  });
  $("#setBtn").addEventListener("click", openSettings);
  $("#importBtn").addEventListener("click", openImport);
  Array.prototype.forEach.call(document.querySelectorAll(".nav-tabs button"), function (b) {
    b.addEventListener("click", function () { view = b.dataset.view; window.scrollTo(0, 0); render(); });
  });
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 180); });

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll(".nav-tabs button"), function (b) { b.setAttribute("aria-selected", String(b.dataset.view === view)); });
    var host = $("#view"); host.innerHTML = "";
    var root = el("div"); host.appendChild(root);
    if (view === "overview") renderOverview(root);
    else if (view === "transactions") renderTransactions(root);
    else if (view === "investing") renderInvesting(root);
    else renderGuide(root);
  }
  render();

})();
</script>

</body></html>
